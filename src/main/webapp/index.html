<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome | Identity & Access Portal</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="container">
		<div style="text-align: center;">
			<span class="brand-badge">⚡ SSO & OAuth 2.0</span>
			<h1>Welcome Back</h1>
			<p class="subtitle">Secure authentication portal for single sign-on & services</p>
		</div>

		<div class="button-stack">
			<button id="samlLoginBtn" class="saml-btn">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
				</svg>
				Login with SAML
			</button>

			<button id="parichayLoginBtn" class="btn oauth-btn">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" stroke-linejoin="round">
					<rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
					<path d="M7 11V7a5 5 0 0 1 10 0v4" />
				</svg>
				Login with Parichay OAuth
			</button>
		</div>

		<div class="divider">
			<span>or credentials</span>
		</div>

		<div class="button-stack">
			<a href="login.html" class="btn btn-secondary">
				Sign In with Email
			</a>
		</div>

		<div class="links">
			<p>New user? <a href="register.html">Create an account</a></p>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="index.js"></script>
	<script src="login.js"></script>
</body>

</html>
